<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="  background: url('assets/premium_photo.png') !important;
    background-size: cover !important;
    background-position: center !important;
">


  <header class="site-header">
    <div class="container nav-inner">

        <div class="brand">
            <a href="index.html">
                <span class="brand-company">PERSISTENT FARS HOMELAND</span>
                <small class="brand-sub">International Co. Ltd.</small>
            </a>
        </div>

        <nav class="main-nav">
            <button id="mobileToggle" class="mobile-toggle" aria-expanded="false">
                <i class="fa fa-bars"></i>
            </button>

            <ul id="navList" class="nav-list">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="whoWeAre.html">Who We Are</a></li>
                <li><a href="product.html">Our Products</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </div>
</header>


<section class="profile-section">
    <div class="profile-container">

        <!-- Logo -->
        <div class="logo-circle">
            <img src="assets/logo.png" alt="Company Logo">
        </div>

        <!-- Bottom Blue Bar -->
        <div class="bottom-bar">
            <p>Your Trusted & Persistent Partner in Trade</p>
        </div>

    </div>
</section>












<script>
    // mobile nav toggle
    const btn = document.getElementById('mobileToggle');
    const navList = document.getElementById('navList');

    btn.addEventListener('click', () => {
        navList.classList.toggle('nav-open');
        btn.setAttribute('aria-expanded',
            btn.getAttribute('aria-expanded') === 'false'
            ? 'true' : 'false'
        );
    });
</script>


    
</body>
</html>
